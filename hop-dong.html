<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tạo hợp đồng TTS</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f1;--card:#fff;--tx:#1f2328;--mut:#6b7280;--bd:#d9d6cc;--ac:#c0392b;--acx:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16171a;--card:#202226;--tx:#e8e6e1;--mut:#9aa0a6;--bd:#3a3d43;--ac:#e0594a;--acx:#fff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16171a;--card:#202226;--tx:#e8e6e1;--mut:#9aa0a6;--bd:#3a3d43;--ac:#e0594a;--acx:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}p.s{color:var(--mut);margin:0 0 14px;font-size:13px}
section{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
h2{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:7px 8px;min-width:0;width:100%}
input:focus{outline:2px solid var(--ac);outline-offset:-1px}
.p{border:1px dashed var(--bd);border-radius:8px;padding:10px;margin-bottom:10px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px}
button.pr{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600;padding:10px 18px}
.ck{display:flex;flex-wrap:wrap;gap:6px 18px}.ck label{flex-direction:row;align-items:center;gap:6px;color:var(--tx);font-size:14px}.ck input{width:auto}
#st{margin-top:10px;font-size:13px;color:var(--mut);white-space:pre-wrap}
.auto{font-style:italic}
</style></head><body><main>
<h1>Tạo hợp đồng Nhật – Việt</h1>
<p class="s">Sao chép nguyên file mẫu gốc, chỉ thay các chữ <b style="color:var(--ac)">màu đỏ</b>. Ô để trống = giữ nguyên nội dung mẫu. Mỗi người một bộ hợp đồng; riêng mẫu 1-28 gộp tất cả người vào 1 file.</p>

<section><h2>1. Thông tin chung của đơn hàng</h2><div class="g" id="common"></div></section>
<section><h2>2. Danh sách thực tập sinh</h2><div id="people"></div><button id="add">＋ Thêm người</button></section>
<section><h2>3. Chọn file xuất</h2><div class="ck" id="docs"></div>
<p style="margin:14px 0 0"><button class="pr" id="go">Tạo file &amp; tải ZIP</button></p><div id="st"></div></section>
</main>

function groups(p){const out=[];let cur=null;
 for(const r of p.getElementsByTagNameNS(W,'r')){const ts=[...r.getElementsByTagNameNS(W,'t')],tx=ts.map(t=>t.textContent).join('');if(!tx)continue;
  const c=r.getElementsByTagNameNS(W,'color')[0],red=c&&/^(FF0000|C00000)$/i.test(c.getAttributeNS(W,'val')||'');
  if(red){if(!cur){cur=[];out.push(cur)}cur.push({ts,tx})}else cur=null}return out}
function setG(g,val){const k=Math.max(0,g.findIndex(x=>x.tx.trim()));
 g.forEach((x,j)=>{if(j===k){x.ts[0].textContent=val;x.ts[0].setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');x.ts.slice(1).forEach(t=>t.textContent='')}
  else if(x.tx.trim())x.ts.forEach(t=>t.textContent='')})}
async function docx(key,v){const z=await JSZip.loadAsync(T[key],{base64:true});
 const doc=new DOMParser().parseFromString(await z.file('word/document.xml').async('string'),'application/xml');
 const ps=doc.getElementsByTagNameNS(W,'p'),cache={};
 for(const [p,g,...o] of SP[key]){const k=g=='R'?o[2]:o[0],val=v[k];if(!val)continue;
  if(g=='R'){const rs=[...ps[p].getElementsByTagNameNS(W,'r')].slice(o[0],o[1]+1);rs.forEach((r,j)=>{const ts=[...r.getElementsByTagNameNS(W,'t')];if(j==0&&ts[0]){ts[0].textContent=val;ts[0].setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');ts.slice(1).forEach(t=>t.textContent='')}else ts.forEach(t=>t.textContent='')});continue}
  const c=cache[p]||(cache[p]=groups(ps[p]));if(c[g])setG(c[g],val)}
 z.file('word/document.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n'+new XMLSerializer().serializeToString(doc).replace(/^<\?xml[^>]*\?>\s*/,''));
 return z.generateAsync({type:'uint8array',compression:'DEFLATE'})}

function setCell(x,ref,inner){const re=new RegExp(`<c r="${ref}"([^>]*?)(/>|>[\\s\\S]*?</c>)`);
 return x.replace(re,(m,a)=>`<c r="${ref}"${a.replace(/\s*t="[^"]*"/,'').replace(/\/$/,'')} t="inlineStr"><is>${inner}</is></c>`)}
const txt=s=>`<t xml:space="preserve">${esc(s)}</t>`;
function setRich(sh,ss,ref,vals){const m=new RegExp(`<c r="${ref}"[^>]*?><v>(\\d+)</v></c>`).exec(sh);if(!m)return sh;
 let inner=ss.match(/<si>[\s\S]*?<\/si>/g)[+m[1]].replace(/^<si>|<\/si>$/g,'').replace(/<phoneticPr[^>]*\/>/g,'');let k=0;
 inner=inner.replace(/(<r>(?:(?!<\/r>)[\s\S])*?FFFF0000(?:(?!<\/r>)[\s\S])*?)<t[^>]*>([^<]*)(<\/t><\/r>)/g,(a,b,t,c)=>{const v=vals[k++];return v?`${b}<t xml:space="preserve">${t.match(/^\s*/)[0]}${v}${c}`:a});
 return setCell(sh,ref,inner)}
async function x10(v){const z=await JSZip.loadAsync(T.f10,{base64:true});

 const S=(r,s)=>{if(s)sh=setCell(sh,r,txt(s))};
 S('M11',v.enJP&&(v.enJP+(v.enRo?'\n'+v.enRo:'')));S('M12',v.unJP&&(v.unJP+(v.unRo?'\n'+v.unRo:'')));S('M13',v.nA);
 S('AB31',v.fy);S('AF31',v.fm);S('AI31',v.fdd);S('Z32',v.fy);

async function x28(P,c,f){const z=await JSZip.loadAsync(T.f28,{base64:true});
 let sh=await z.file('xl/worksheets/sheet1.xml').async('string'),ss=await z.file('xl/sharedStrings.xml').async('string'),wb=await z.file('xl/workbook.xml').async('string');
 const R={};sh.replace(/<row r="(\d+)"[^>]*?(?:\/>|>[\s\S]*?<\/row>)/g,(m,n)=>{R[n]=m});
 const N=P.length,sf=2*(N-2),ren=(x,n)=>x.replace(/<row r="\d+"/,`<row r="${n}"`).replace(/(<c r="[A-Z]+)\d+"/g,`$1${n}"`);
 let rows='';for(let i=1;i<=7;i++)rows+=R[i];
 P.forEach((p,i)=>{const r=8+2*i;let a=ren(i?R[10]:R[8],r),b=ren(i==N-1?R[11]:R[9],r+1);
  if(p.nA)a=setCell(a,'C'+r,txt(p.nA+' '));if(c.jobJP)b=setCell(b,'E'+(r+1),txt(c.jobJP));rows+=a+b});
 for(let n=12;n<=28;n++)if(R[n])rows+=ren(R[n],n+sf);
 sh=sh.replace(/<sheetData>[\s\S]*<\/sheetData>/,`<sheetData>${rows}</sheetData>`)
  .replace('A8:A11',`A8:A${7+2*N}`).replace(/<mergeCell ref="([A-Z]+)(\d+):([A-Z]+)(\d+)"\/>/g,(m,a,b,c2,d)=>+b>=12?`<mergeCell ref="${a}${+b+sf}:${c2}${+d+sf}"/>`:m)
  .replace('<dimension ref="A1:I28"/>',`<dimension ref="A1:I${28+sf}"/>`);
 wb=wb.replace(/\$E\$(\d+)/,(m,n)=>'$E$'+(+n+sf));
 if(f.fy)sh=setRich(sh,ss,'D'+(19+sf),[f.fy,f.fm,f.fdd]);
 z.file('xl/worksheets/sheet1.xml',sh);z.file('xl/workbook.xml',wb);return z.generateAsync({type:'uint8array',compression:'DEFLATE'})}
